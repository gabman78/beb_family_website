<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Calendario Camera Vesuvio</title>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <style>
    :root {
      --colore-principale: #4a90c2;
      --colore-occupato: #d9534f;
      --colore-libero: #4caf50;
      --sfondo: #eaf6ff;
      --bianco: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--sfondo);
      padding: 12px;
      color: #2f4f6f;
      overflow-x: hidden;
    }

    #calendar {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
      background: var(--bianco);
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      padding: 60px 12px 20px 12px;
      overflow-x: auto;
    }

    /* Stili FullCalendar responsive */
    .fc {
      min-width: 500px;
    }

    .fc .fc-toolbar {
      flex-direction: column;
      gap: 10px;
    }

    .fc-toolbar-title {
      text-transform: capitalize;
      text-align: center !important;
      font-size: 1.4rem !important;
      font-weight: 800;
      color: var(--colore-principale);
    }

    .fc-button {
      background: var(--colore-principale) !important;
      border: none !important;
      color: white !important;
      border-radius: 8px !important;
      padding: 6px 12px !important;
      font-size: 0.85rem !important;
    }

    .fc-daygrid-day-frame {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 4px 0;
      transition: background-color 0.25s ease;
    }

    .fc-daygrid-day:hover {
      background-color: #d4ecff !important;
      cursor: pointer;
    }

    .fc-daygrid-day-number {
      font-size: 1.1rem !important;
      font-weight: 900;
      color: #2f4f6f;
    }

    .fc-daygrid-day-number::after {
      display: block;
      margin-top: 2px;
      font-size: 0.65rem;
      font-weight: 600;
    }

    .fc-daygrid-day.fc-day-libero .fc-daygrid-day-number::after {
      content: "Disponibile";
      color: var(--colore-libero);
    }
    .fc-daygrid-day.fc-day-occupato .fc-daygrid-day-number::after {
      content: "Occupato";
      color: var(--colore-occupato);
    }

    .fc-daygrid-day.past-day {
      opacity: 0.5;
      filter: saturate(0.8);   
      background-color: #dbe5f0 !important;
      pointer-events: none;
    }

    .fc-daygrid-day.past-day .fc-daygrid-day-number::after {
      content: "Passato";
      color: #7a99b5;
    }

    /* Legenda */
    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 15px;
      font-size: 0.75rem;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-item .box {
      width: 14px;
      height: 14px;
      border-radius: 4px;
    }
    .legend-item .occ { background: var(--colore-occupato); }
    .legend-item .lib { background: var(--colore-libero); }

    #status {
      text-align: center;
      color: #2f4f6f;
      margin-bottom: 10px;
      font-size: 0.8rem;
    }

    /* Frecce laterali */
    .nav-arrow {
      position: absolute;
      top: 15px;
      background: transparent;
      border: none;
      font-size: 2rem;
      font-weight: 700;
      color: var(--colore-principale);
      cursor: pointer;
      z-index: 9999;
      transition: color 0.3s ease;
      padding: 0 10px;
    }

    .nav-arrow.left { left: 5px; }
    .nav-arrow.right { right: 5px; }

    .nav-arrow:hover {
      color: #064c5f;
      transform: scale(1.1);
    }

    /* Messaggio scroll mobile */
    .scroll-hint {
      display: none;
      text-align: center;
      font-size: 0.7rem;
      color: #6c5b47;
      margin-top: 10px;
      padding: 5px;
      background: rgba(255,255,255,0.8);
      border-radius: 20px;
    }

    /* ============================================
       MOBILE SPECIFIC
       ============================================ */
    @media (max-width: 768px) {
      body {
        padding: 8px;
      }
      
      #calendar {
        padding: 50px 8px 15px 8px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      
      .fc {
        min-width: 600px;
      }
      
      .fc-toolbar-title {
        font-size: 1.1rem !important;
      }
      
      .fc-daygrid-day-number {
        font-size: 0.9rem !important;
      }
      
      .fc-daygrid-day-number::after {
        font-size: 0.55rem;
      }
      
      .nav-arrow {
        top: 10px;
        font-size: 1.5rem;
      }
      
      .scroll-hint {
        display: block;
      }
      
      .legend {
        gap: 15px;
        font-size: 0.7rem;
      }
    }

    @media (max-width: 480px) {
      .fc {
        min-width: 550px;
      }
    }
  </style>
</head>
<body>
  <div id="status">⏳ Caricamento disponibilità...</div>
  <div id="calendar">
    <button class="nav-arrow left" id="prevMonth">‹</button>
    <button class="nav-arrow right" id="nextMonth">›</button>
  </div>
  <div class="scroll-hint">
    <i class="fa-solid fa-arrows-left-right"></i> Scorri orizzontalmente per vedere tutti i mesi <i class="fa-solid fa-arrows-left-right"></i>
  </div>
  <div class="legend">
    <div class="legend-item"><span class="box occ"></span><span>Occupato</span></div>
    <div class="legend-item"><span class="box lib"></span><span>Disponibile</span></div>
  </div>

  <!-- FontAwesome per icone -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      const calendarEl = document.getElementById('calendar');
      const statusEl = document.getElementById('status');
      let dateRanges = [];

      try {
        const response = await fetch('/api/calendar/vesuvio/');
        if (!response.ok) throw new Error("Errore nel caricamento calendario.");
        const data = await response.json();
        dateRanges = data.map(ev => ({ start: new Date(ev.start), end: new Date(ev.end) }));
        statusEl.textContent = "👀 Controlla le disponibilità:";
      } catch (err) {
        console.error(err);
        statusEl.textContent = "⚠️ Non è stato possibile caricare la disponibilità in tempo reale.";
      }

      const toDateOnly = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        height: 'auto',
        locale: 'it',
        firstDay: 1,
        headerToolbar: { left: '', center: 'title', right: '' },

        dayCellDidMount: function (arg) {
          const dayDate = toDateOnly(arg.date);
          const occupato = dateRanges.some(range => {
            const start = toDateOnly(range.start);
            const end = toDateOnly(range.end);
            return dayDate >= start && dayDate < end;
          });

          if (occupato) arg.el.classList.add('fc-day-occupato');
          else arg.el.classList.add('fc-day-libero');

          const today = toDateOnly(new Date());
          if (dayDate < today) arg.el.classList.add('past-day');
        }
      });
      
      calendar.render();

      document.getElementById("prevMonth").addEventListener("click", () => calendar.prev());
      document.getElementById("nextMonth").addEventListener("click", () => calendar.next());

      // Invio altezza al parent iframe
      const sendHeight = () => {
        window.parent.postMessage({ type: "resize-calendar", height: document.body.scrollHeight }, "*");
      };
      
      const resizeObserver = new ResizeObserver(() => sendHeight());
      resizeObserver.observe(document.body);
      
      setTimeout(sendHeight, 100);
    });
  </script>
</body>
</html>
